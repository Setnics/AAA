name: 🔄 Sondeo Semanal de Precios — SEITE

on:
  # Lunes 12:30 UTC = 6:30 AM Costa Rica (UTC-6, sin horario de verano)
  schedule:
    - cron: '30 12 * * 1'

  # También ejecutable manualmente desde GitHub → Actions → Run workflow
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Ejecutar sin escribir a Supabase (dry run)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  update-prices:
    name: Actualizar precios de materiales eléctricos CR
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/price-updater/package.json

      - name: 📦 Instalar dependencias
        working-directory: scripts/price-updater
        run: npm install

      - name: 🎭 Instalar Playwright (Chromium)
        working-directory: scripts/price-updater
        run: npx playwright install chromium --with-deps

      - name: 🔍 Ejecutar sondeo de precios
        working-directory: scripts/price-updater
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "Modo DRY RUN activado"
            node index.js --dry-run
          else
            node index.js
          fi

      - name: 📊 Subir log como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-update-log-${{ github.run_id }}
          path: scripts/price-updater/*.log
          if-no-files-found: ignore
          retention-days: 30
